name: Backtest

# Runs the walk-forward backtest against REAL exchange data and prints the
# report into the run log. Triggers on strategy-code changes so a change that
# quietly destroys the edge shows up immediately, and on demand.
on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of history to fetch"
        default: "720"
        type: string
      timeframe:
        description: "Bar size"
        default: "1h"
        type: choice
        options: ["1h", "6h", "1d"]
      trials:
        description: "Configurations tested so far (drives the DSR haircut)"
        default: "2"
        type: string
  push:
    paths:
      - "quantbot/**"
      - "config*.yaml"
      - "scripts/**"
      - ".github/workflows/backtest.yml"

concurrency:
  group: backtest-${{ github.ref }}
  # Queue rather than cancel: a backtest takes ~15 minutes, and killing one
  # mid-flight to start another just loses the result you were waiting for.
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Confirm the exchange is actually reachable
        run: |
          echo "Runner egress check (this is what the sandbox could not do):"
          for h in api.exchange.coinbase.com api.binance.com; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://$h/" || echo 000)
            echo "  $h -> HTTP $code"
          done

      - name: Run walk-forward backtest on real market data
        id: bt
        env:
          LOOKBACK: ${{ inputs.lookback_days || '720' }}
          TIMEFRAME: ${{ inputs.timeframe || '1h' }}
          # INCREMENT THIS on every retest against the same data. Each retest
          # is another draw from the multiple-testing urn, and under-reporting
          # it is only ever lying to yourself.
          TRIALS: ${{ inputs.trials || '2' }}
        run: |
          python - <<'PY'
          import os, yaml
          cfg = yaml.safe_load(open("config.yaml"))
          cfg["data"]["lookback_days"] = int(os.environ["LOOKBACK"])
          cfg["data"]["timeframe"] = os.environ["TIMEFRAME"]
          yaml.safe_dump(cfg, open("config.yaml", "w"), sort_keys=False)
          print("timeframe:", cfg["data"]["timeframe"],
                "lookback:", cfg["data"]["lookback_days"],
                "symbols:", cfg["data"]["symbols"])
          PY
          python -m quantbot backtest \
            --trials "$TRIALS" \
            --plot reports/backtest.png \
            --json-out reports/metrics.json \
            --equity-out reports/equity.csv \
            -v 2>&1 | tee reports_log.txt

      - name: Summarise to the run page
        if: always()
        run: |
          {
            echo "## Backtest on real market data"
            echo '```'
            sed -n '/--- STRATEGY/,$p' reports_log.txt 2>/dev/null | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: How many independent bets does each book hold?
        if: always()
        run: |
          python scripts/diversification.py 2>&1 | tee diversification_log.txt

      - name: Diversified multi-asset backtest on real data
        if: always()
        run: |
          python -m quantbot backtest -c config.diversified.yaml \
            --trials 8 \
            --plot reports/diversified.png \
            --json-out reports/diversified_metrics.json \
            -v 2>&1 | tee diversified_log.txt

      - name: Grade historical out-of-sample calls (crypto trend)
        if: always()
        run: |
          python - <<'PY'
          import yaml
          c = yaml.safe_load(open("config.yaml"))
          c["model"]["kind"] = "trend"
          yaml.safe_dump(c, open("/tmp/crypto_trend.yaml", "w"), sort_keys=False)
          PY
          python -m quantbot backfill -c /tmp/crypto_trend.yaml --trials 8 \
            2>&1 | tee backfill_crypto.txt

      - name: Grade historical out-of-sample calls (diversified)
        if: always()
        run: |
          python -m quantbot backfill -c config.diversified.yaml --trials 8 \
            2>&1 | tee backfill_div.txt

      - name: Crisis test - trend overlay across three decades
        if: always()
        run: |
          python scripts/crisis.py -c config.overlay.yaml --trials 11 \
            2>&1 | tee crisis_log.txt

      - name: Pre-registered strategy comparison (dev vs holdout)
        if: always()
        run: |
          python scripts/compare.py --holdout-frac 0.30 --trials 10 \
            2>&1 | tee compare_log.txt

      - name: Comparison to the run page
        if: always()
        run: |
          {
            echo "## Crisis test - trend overlay, three decades"
            echo '```'
            sed -n '/CRISIS PERIODS/,$p' crisis_log.txt 2>/dev/null | head -45
            echo '```'
            echo "## Graded out-of-sample calls - crypto trend"
            echo '```'
            sed -n '/HISTORICAL OUT-OF-SAMPLE/,$p' backfill_crypto.txt 2>/dev/null | head -55
            echo '```'
            echo "## Graded out-of-sample calls - diversified"
            echo '```'
            sed -n '/HISTORICAL OUT-OF-SAMPLE/,$p' backfill_div.txt 2>/dev/null | head -55
            echo '```'
            echo "## Diversification"
            echo '```'
            cat diversification_log.txt 2>/dev/null | head -30
            echo '```'
            echo "## Diversified multi-asset backtest"
            echo '```'
            sed -n '/--- STRATEGY/,$p' diversified_log.txt 2>/dev/null | head -45
            echo '```'
            echo "## Strategy comparison (real data, dev vs holdout)"
            echo '```'
            sed -n '/PRE-REGISTERED COMPARISON/,$p' compare_log.txt | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: |
            reports/
            reports_log.txt
            compare_log.txt
            diversified_log.txt
            diversification_log.txt
            backfill_crypto.txt
            backfill_div.txt
            crisis_log.txt
          if-no-files-found: warn
          retention-days: 30
