# Equities configuration. Run with: python -m quantbot paper -c config.stocks.yaml
#
# Uses the TREND engine, not the ML model. That is not a preference, it is what
# the evidence said: in the pre-registered comparison on real data the ML
# engine was the worst candidate in both periods (holdout -12.5%, DSR 0.058)
# while trend at daily frequency held up best and traded a fifth as often.

data:
  source: stooq             # free, no API key; falls back to yahoo
  symbols: ["SPY", "QQQ", "AAPL", "MSFT", "NVDA"]
  timeframe: "1d"           # free equity feeds are daily; trend prefers it anyway
  lookback_days: 1460       # ~4 years of sessions
  cache_dir: data_cache
  benchmark: "SPY"
  annual_days: 252          # trading sessions, NOT 365 - see data/equities.py
  asset_class: equity

labels:
  horizon_bars: 5           # judge each call over the next week of sessions
  upper_sigma: 1.5
  lower_sigma: 1.5
  vol_window: 20

model:
  kind: trend
  trend_lookbacks: [5, 20, 60, 120]   # week, month, quarter, half-year
  trend_scale: 1.5
  train_bars: 400
  min_train_bars: 150
  retrain_every: 20
  embargo_bars: 5

risk:
  target_annual_vol: 0.15   # lower than crypto; equities are calmer
  max_gross_leverage: 1.0
  max_position_weight: 0.35
  kelly_fraction: 0.30
  conviction_deadband: 0.04
  allow_shorts: false
  max_drawdown_stop: 0.20
  drawdown_recovery: 0.08
  cov_span: 60
  scalar_smoothing: 10

costs:
  taker_fee_bps: 1.0        # most US brokers are commission-free; this is slippage
  half_spread_bps: 2.0
  slippage_coef: 0.25
  min_trade_weight: 0.03
  rebalance_band: 0.30
  rebalance_every: 1        # daily bars already rebalance slowly

alerts:
  channels: ["console", "telegram"]
  min_weight_change: 0.05
  send_heartbeat: false

initial_capital: 10000.0
state_dir: state/stocks     # separate book and journal from crypto
seed: 7
